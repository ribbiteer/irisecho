licenses:
  apache-2.0:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
    commercial: true
  mit:
    name: MIT License
    url: https://opensource.org/license/mit
    commercial: true
  flux-dev-nc:
    name: FLUX.1 [dev] Non-Commercial License
    url: https://huggingface.co/black-forest-labs/FLUX.1-dev/blob/main/LICENSE.md
    commercial: false
    accept: true
    summary: >-
      Free for personal, research and other non-commercial use. Commercial use
      of the model needs a license from Black Forest Labs.
  qwen-research:
    name: Qwen Research License
    url: https://huggingface.co/Qwen/Qwen-Image-2.1/blob/main/LICENSE
    # Qwen (QwenDevs on X, https://x.com/QwenDevs/status/2101917379785838660): "Outputs are
    # not part of the licensed Materials. Users retain the rights to images and other content
    # they generate using the model." So the pictures may be used commercially.
    commercial: true
    condition: Model files under a research license
    accept: true
    summary: >-
      The pictures you make are yours to use, commercially too: Qwen has said
      that outputs are not part of the licensed Materials and that users keep
      the rights to what they generate. The model itself stays under the
      research license: using, changing or offering the model files commercially
      needs a separate license from Qwen (Hangzhou Tongyi Laboratory). Sharing
      the model files needs a copy of the license and its notice. Qwen can end
      the license if its terms are broken; it is governed by the laws of China.
  stability-community:
    name: Stability AI Community License
    url: https://huggingface.co/stabilityai/stable-audio-3-small-sfx/blob/main/LICENSE.md
    commercial: true
    condition: Free under $1M annual revenue
    accept: true
    gated: true
    summary: >-
      Free for research, personal use, and commercial use by people and
      companies earning under $1M a year. Its text encoder is also covered by
      Google's Gemma Terms of Use. Stability asks you to accept the terms on
      Hugging Face before downloading.
  cc-by-nc-4.0:
    name: Creative Commons Attribution-NonCommercial 4.0
    url: https://creativecommons.org/licenses/by-nc/4.0/
    commercial: false
    accept: true
    summary: >-
      Free to use, share and adapt for non-commercial purposes, with credit to
      the authors. Any commercial use needs separate permission from them.
  minimax-music3-community:
    name: MiniMax-Music3 Community License
    url: https://huggingface.co/MiniMaxAI/MiniMax-Music3/blob/main/LICENSE
    commercial: true
    condition: Free under $20M annual revenue
    accept: true
    summary: >-
      Free for personal and commercial use. A commercial product or service
      that uses it must show "MiniMax-Music3" in its interface, and above $20M
      a year in revenue needs MiniMax's written permission. Its acceptable use
      policy applies, including saying clearly when published content is
      machine-generated and not infringing anyone's rights.
  stability-community-open:
    name: Stability AI Community License
    url: https://huggingface.co/stabilityai/stable-audio-open-1.0/blob/main/LICENSE.md
    commercial: true
    condition: Free under $1M annual revenue
    accept: true
    summary: >-
      Free for research, personal use, and commercial use by people and
      companies earning under $1M a year. Its text encoder is also covered by
      Google's Gemma Terms of Use. Downloaded from ComfyUI's own copy, so no
      Hugging Face sign-in is needed.
  krea-2-community:
    name: Krea 2 Community License
    url: https://krea.ai/krea-2-licensing
    commercial: true
    condition: Free under $1M annual revenue
    accept: true
    summary: >-
      Free for personal and research use, and for commercial use by people and
      companies earning under $1M a year. You agree to run content filters
      appropriate to how you use it and to follow Krea's acceptable use policy;
      you own what you generate and answer for it. Krea can end the license on
      30 days' notice.
  tencent-hunyuan-community:
    name: Tencent Hunyuan Community License
    url: https://huggingface.co/tencent/HunyuanVideo-1.5/blob/main/LICENSE
    commercial: true
    condition: Not licensed in the EU, UK or South Korea
    accept: true
    summary: >-
      Free for personal and commercial use, except in the European Union, the
      United Kingdom and South Korea, where neither the model nor what it makes
      is licensed. Products with over 100 million monthly users need Tencent's
      permission. Its outputs may not be used to improve other AI models.
  ltx-2x-community:
    name: LTX-2.x Community License
    url: https://github.com/Lightricks/LTX-2/blob/main/LICENSE-2_x
    commercial: true
    condition: Free under $10M annual revenue
    accept: true
    gated: true
    summary: >-
      Free for personal use, research, and commercial use by people and
      companies earning under $10M a year; above that, Lightricks asks for a
      paid license. Its use restrictions apply to what you make, and any
      watermark or provenance marks it adds must stay. Lightricks asks you to
      accept the terms on Hugging Face before downloading.
  trellis2-dinov3:
    name: MIT License and DINOv3 License
    url: https://ai.meta.com/resources/models-and-libraries/dinov3-license/
    commercial: true
    accept: true
    summary: >-
      TRELLIS.2 itself is under the MIT License. It reads pictures with Meta's
      DINOv3, whose license allows personal and commercial use but not military,
      nuclear, espionage or weapons uses, and asks you to follow trade controls
      and to credit DINOv3 in research you publish.
  pixal3d-dinov3:
    name: MIT License and DINOv3 License
    url: https://ai.meta.com/resources/models-and-libraries/dinov3-license/
    commercial: true
    condition: Tencent does not offer it in the EU
    accept: true
    summary: >-
      Pixal3D itself is under the MIT License; Tencent does not offer its own
      download in the European Union. It reads pictures with Meta's DINOv3,
      whose license allows personal and commercial use but not military,
      nuclear, espionage or weapons uses, and asks you to follow trade controls
      and to credit DINOv3 in research you publish.
  pixal3d-moge:
    name: MIT License and DINOv3 License
    url: https://ai.meta.com/resources/models-and-libraries/dinov3-license/
    commercial: true
    condition: Tencent does not offer Pixal3D in the EU
    accept: true
    summary: >-
      Pixal3D itself is under the MIT License; Tencent does not offer its own
      download in the European Union. It reads pictures with Meta's DINOv3,
      whose license allows personal and commercial use but not military,
      nuclear, espionage or weapons uses, and asks you to follow trade controls
      and to credit DINOv3 in research you publish. The camera angle is
      estimated with Microsoft's MoGe-2 (MIT License; its DINOv2 parts are
      Apache 2.0).
  zimage-control:
    name: Apache License 2.0, MIT License and Stable Diffusion 2 heritage
    url: https://huggingface.co/Comfy-Org/SDPose
    commercial: true
    accept: true
    summary: >-
      Z-Image Turbo, its Fun ControlNet and Depth Anything 3 (small) are under
      the Apache License 2.0. The pose reader, SDPose, is published under the
      MIT License, but its card says it starts from Stable Diffusion 2 weights,
      which carry the CreativeML Open RAIL++-M license: free to use, including
      commercially, but not for the harmful uses it lists.

files:
  # Kokoro
  kokoro-model: {repo: hexgrad/Kokoro-82M, path: kokoro-v1_0.pth, category: kokoro}
  kokoro-config: {repo: hexgrad/Kokoro-82M, path: config.json, category: kokoro}
  kokoro-voices:
    repo: hexgrad/Kokoro-82M
    category: kokoro/voices
    paths:
      - voices/af_alloy.pt
      - voices/af_aoede.pt
      - voices/af_bella.pt
      - voices/af_heart.pt
      - voices/af_jessica.pt
      - voices/af_kore.pt
      - voices/af_nicole.pt
      - voices/af_nova.pt
      - voices/af_river.pt
      - voices/af_sarah.pt
      - voices/af_sky.pt
      - voices/am_adam.pt
      - voices/am_echo.pt
      - voices/am_eric.pt
      - voices/am_fenrir.pt
      - voices/am_liam.pt
      - voices/am_michael.pt
      - voices/am_onyx.pt
      - voices/am_puck.pt
      - voices/am_santa.pt
      - voices/bf_alice.pt
      - voices/bf_emma.pt
      - voices/bf_isabella.pt
      - voices/bf_lily.pt
      - voices/bm_daniel.pt
      - voices/bm_fable.pt
      - voices/bm_george.pt
      - voices/bm_lewis.pt

  # ACE-Step 1.5 (music). Folder layout matters, so subfolders are kept.
  # ACE-Step writes its own model code (*.py) into the checkpoint folder on
  # load, so those files are not tracked here, and the folder is never linked
  # from someone else's install (it would be written to).
  ace-step-core:
    repo: ACE-Step/Ace-Step1.5
    category: ace-step
    keep_dirs: true
    no_link: true
    paths:
      - config.json
      - acestep-v15-turbo/config.json
      - acestep-v15-turbo/model.safetensors
      - acestep-v15-turbo/silence_latent.pt
      - vae/config.json
      - vae/diffusion_pytorch_model.safetensors
      - Qwen3-Embedding-0.6B/added_tokens.json
      - Qwen3-Embedding-0.6B/chat_template.jinja
      - Qwen3-Embedding-0.6B/config.json
      - Qwen3-Embedding-0.6B/merges.txt
      - Qwen3-Embedding-0.6B/model.safetensors
      - Qwen3-Embedding-0.6B/special_tokens_map.json
      - Qwen3-Embedding-0.6B/tokenizer.json
      - Qwen3-Embedding-0.6B/tokenizer_config.json
      - Qwen3-Embedding-0.6B/vocab.json
  ace-step-lm:
    repo: ACE-Step/acestep-5Hz-lm-0.6B
    category: ace-step/acestep-5Hz-lm-0.6B
    keep_dirs: true
    no_link: true
    paths:
      - added_tokens.json
      - chat_template.jinja
      - config.json
      - merges.txt
      - model.safetensors
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
      - vocab.json

  # ACE-Step 1.5 XL: the 4B renderers and the 4B song planner. Each lands in its
  # own folder next to the ACE-Step files above (the engine reads them as one
  # checkpoint folder) and shares those files' audio decoder and text encoder.
  ace-step-lm-4b:
    repo: ACE-Step/acestep-5Hz-lm-4B
    category: ace-step/acestep-5Hz-lm-4B
    keep_dirs: true
    no_link: true
    paths:
      - added_tokens.json
      - chat_template.jinja
      - config.json
      - merges.txt
      - model-00001-of-00002.safetensors
      - model-00002-of-00002.safetensors
      - model.safetensors.index.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
      - vocab.json
  ace-step-xl-turbo:
    repo: ACE-Step/acestep-v15-xl-turbo
    category: ace-step/acestep-v15-xl-turbo
    keep_dirs: true
    no_link: true
    paths: &ace-step-xl-paths
      - config.json
      - model-00001-of-00004.safetensors
      - model-00002-of-00004.safetensors
      - model-00003-of-00004.safetensors
      - model-00004-of-00004.safetensors
      - model.safetensors.index.json
      - silence_latent.pt
  ace-step-xl-sft:
    repo: ACE-Step/acestep-v15-xl-sft
    category: ace-step/acestep-v15-xl-sft
    keep_dirs: true
    no_link: true
    paths: *ace-step-xl-paths

  # Stable Audio 3 Small-SFX (sound effects). Gated: needs a Hugging Face token.
  sa3-sfx:
    repo: stabilityai/stable-audio-3-small-sfx
    category: stable-audio-3/small-sfx
    keep_dirs: true
    paths:
      - model_config.json
      - model.safetensors
      - t5gemma-b-b-ul2/config.json
      - t5gemma-b-b-ul2/generation_config.json
      - t5gemma-b-b-ul2/model.safetensors
      - t5gemma-b-b-ul2/special_tokens_map.json
      - t5gemma-b-b-ul2/tokenizer.json
      - t5gemma-b-b-ul2/tokenizer.model
      - t5gemma-b-b-ul2/tokenizer_config.json

  # Chatterbox (voice cloning). Each model reads one folder.
  chatterbox:
    repo: ResembleAI/chatterbox
    category: chatterbox/classic
    keep_dirs: true
    paths: [ve.safetensors, t3_cfg.safetensors, s3gen.safetensors, tokenizer.json, conds.pt]
  chatterbox-turbo:
    repo: ResembleAI/chatterbox-turbo
    category: chatterbox/turbo
    keep_dirs: true
    paths:
      - ve.safetensors
      - t3_turbo_v1.safetensors
      - t3_turbo_v1.yaml
      - s3gen_meanflow.safetensors
      - conds.pt
      - added_tokens.json
      - merges.txt
      - special_tokens_map.json
      - tokenizer_config.json
      - vocab.json

  # Qwen3-VL-4B-Instruct (prompt writer). transformers reads the whole folder.
  qwen3-vl-4b:
    repo: Qwen/Qwen3-VL-4B-Instruct
    category: llm/Qwen3-VL-4B-Instruct
    keep_dirs: true
    paths:
      - chat_template.json
      - config.json
      - generation_config.json
      - merges.txt
      - model-00001-of-00002.safetensors
      - model-00002-of-00002.safetensors
      - model.safetensors.index.json
      - preprocessor_config.json
      - tokenizer.json
      - tokenizer_config.json
      - video_preprocessor_config.json
      - vocab.json

  # Shared encoders and VAEs
  flux-ae:
    repo: Comfy-Org/z_image_turbo
    path: split_files/vae/ae.safetensors
    save_as: flux-ae.safetensors
    category: vae
  qwen3-4b:
    repo: Comfy-Org/z_image_turbo
    path: split_files/text_encoders/qwen_3_4b.safetensors
    category: text_encoders
  t5xxl-fp8:
    repo: comfyanonymous/flux_text_encoders
    path: t5xxl_fp8_e4m3fn_scaled.safetensors
    category: text_encoders
  clip-l:
    repo: comfyanonymous/flux_text_encoders
    path: clip_l.safetensors
    category: text_encoders
  qwen25vl-fp8:
    repo: Comfy-Org/Qwen-Image_ComfyUI
    path: split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
    category: text_encoders
  qwen-image-vae:
    repo: Comfy-Org/Qwen-Image_ComfyUI
    path: split_files/vae/qwen_image_vae.safetensors
    category: vae

  # Diffusion models
  zimage-int4:
    repo: nunchaku-ai/nunchaku-z-image-turbo
    path: svdq-int4_r128-z-image-turbo.safetensors
    category: diffusion_models
  zimage-fp4:
    repo: nunchaku-ai/nunchaku-z-image-turbo
    path: svdq-fp4_r128-z-image-turbo.safetensors
    category: diffusion_models
