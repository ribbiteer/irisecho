models:
  qwen-edit-fast:
    name: Qwen Edit Fast
    kind: edit
    engine: comfy
    license: apache-2.0
    summary: Change a picture by describing the change. Four steps, about fifteen seconds.
    settings: {prompt_style: qwen-edit, steps: 4, cfg: 1.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-edit
        files: [qwen-edit-fast-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-edit
        files: [qwen-edit-fast-fp4, qwen25vl-fp8, qwen-image-vae]

  qwen-edit:
    name: Qwen Edit
    kind: edit
    engine: comfy
    license: apache-2.0
    summary: The careful version. Eight steps for finished work; combine up to three pictures.
    settings: {prompt_style: qwen-edit, steps: 8, cfg: 1.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-edit
        files: [qwen-edit-8step-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-edit
        files: [qwen-edit-8step-fp4, qwen25vl-fp8, qwen-image-vae]

  flux-kontext:
    name: FLUX.1 Kontext
    kind: edit
    engine: comfy
    license: flux-dev-nc
    summary: Restyle or retouch while keeping what matters. Say only what should change. Non-commercial.
    settings: {prompt_style: kontext, steps: 20, guidance: 2.5}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: kontext
        files: [kontext-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: kontext
        files: [kontext-fp4, t5xxl-fp8, clip-l, flux-ae]

  seedvr2:
    name: SeedVR2
    kind: upscale
    engine: comfy
    license: apache-2.0
    summary: Restores detail and enlarges 2, 3 or 4 times. No prompt needed.
    variants:
      - when: {backend: cuda}
        workflow: seedvr2
        files: [seedvr2-3b, seedvr2-vae]

  seedvr2-video:
    name: SeedVR2 Video
    kind: video-upscale  # not a studio: reached through the API and the command line only
    engine: comfy
    license: apache-2.0
    summary: Restores detail in a whole clip and enlarges it to 1080p. Experimental; it can make faces look plastic and add grit and flicker, so compare it with a plain resize.
    variants:
      - when: {backend: cuda}
        workflow: seedvr2-video
        files: [seedvr2-3b, seedvr2-vae]

  wan22-i2v:
    name: Wan 2.2 from a picture
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Brings a still to life. Give a first frame, a last frame, or both.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      video: {frames: [start, end], needs_frame: true, sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 45, large: 60, 720p: 100}}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-i2v-high, wan-i2v-low, wan-i2v-lora-high, wan-i2v-lora-low, wan-umt5, wan-vae, film]

  wan22-i2v-1022:
    name: Wan 2.2 camera moves
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Bigger camera moves that keep faces intact. A last frame sets where the move ends.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      distill: "1022"
      video: {frames: [start, end], needs_frame: true, sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 45, large: 60, 720p: 100}}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-i2v-high, wan-i2v-low, wan-i2v-lora-1022-high, wan-i2v-lora-1022-low, wan-umt5, wan-vae, film]

  wan22-t2v:
    name: Wan 2.2 from text
    kind: video
    engine: comfy
    license: apache-2.0
    summary: A short clip from a description alone.
    settings:
      prompt_style: wan-t2v
      mode: t2v
      video: {frames: [], sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 45, large: 60, 720p: 100}}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-t2v-high, wan-t2v-low, wan-t2v-lora-high, wan-t2v-lora-low, wan-umt5, wan-vae, film]

  wan22-i2v-260412:
    name: Wan 2.2 from a picture (2026 distill)
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Test entry. lightx2v's April 2026 four-step distill, tuned for 720p.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      experts: wan-i2v-260412
      distill: merged
      video: {frames: [start, end], needs_frame: true, sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 45, large: 60, 720p: 100}}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-i2v-260412-high, wan-i2v-260412-low, wan-umt5, wan-vae, film]

  wan22-t2v-1217:
    name: Wan 2.2 from text (1217 distill)
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Test entry. lightx2v's December four-step LoRAs for text to video.
    settings:
      prompt_style: wan-t2v
      mode: t2v
      distill: "1217"
      video: {frames: [], sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 45, large: 60, 720p: 100}}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-t2v-high, wan-t2v-low, wan-t2v-lora-1217-high, wan-t2v-lora-1217-low, wan-umt5, wan-vae, film]

  hunyuan15-i2v:
    name: HunyuanVideo 1.5 from a picture
    kind: video
    engine: comfy
    license: tencent-hunyuan-community
    summary: Test entry. Brings a still to life in eight steps.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      video: {frames: [start], needs_frame: true, sizes: [standard, 720p], fps: 24, sound: false, pace: {standard: 45, 720p: 100}}
    variants:
      - when: {backend: cuda}
        workflow: hunyuan15
        files: [hy15-i2v-480-distill, hy15-sr-720, hy15-upsampler-720, qwen25vl-fp8, hy15-byt5, hy15-vae, sigclip-384, film]

  ltx23:
    name: LTX-2.3
    kind: video
    engine: comfy
    license: ltx-2-community
    summary: Test entry. Picture and sound together, from text, a first frame, a last frame or both.
    settings:
      prompt_style: ltx
      gguf: true
      video: {frames: [start, end], sizes: [standard, large, 720p], fps: 24, sound: true, pace: {standard: 45, large: 60, 720p: 100}}
      parts:
        unet: ltx23-unet-q4
        text_encoder: gemma3-12b-q4
        connectors: ltx23-connectors
        vae: ltx23-vae
        audio_vae: ltx23-audio-vae
        upscaler: ltx23-upscaler
    variants:
      - when: {backend: cuda}
        workflow: ltx
        files: [ltx23-unet-q4, gemma3-12b-q4, ltx23-connectors, ltx23-vae, ltx23-audio-vae, ltx23-upscaler, film]

  ltx25:
    name: LTX-2.5
    kind: video
    engine: comfy
    license: ltx-2x-community
    summary: Test entry. Picture and sound together, from text, a first frame, a last frame or both.
    settings:
      prompt_style: ltx
      gguf: true
      sampler: euler_ancestral
      video: {frames: [start, end], sizes: [standard, large, 720p], fps: 24, sound: true, pace: {standard: 45, large: 60, 720p: 100}}
      parts:
        unet: ltx25-unet-q4
        text_encoder: ltx25-text-encoder
        vae: ltx25-vae
        audio_vae: ltx25-audio-vae
        upscaler: ltx25-upscaler
    variants:
      - when: {backend: cuda}
        workflow: ltx
        files: [ltx25-unet-q4, ltx25-text-encoder, ltx25-vae, ltx25-audio-vae, ltx25-upscaler, film]

  ltx25-int8:
    name: LTX-2.5 (int8)
    kind: video
    engine: comfy
    license: ltx-2x-community
    summary: Test entry. Lightricks' own int8 build of LTX-2.5.
    settings:
      prompt_style: ltx
      sampler: euler_ancestral
      video: {frames: [start, end], sizes: [standard, large, 720p], fps: 24, sound: true, pace: {standard: 45, large: 60, 720p: 100}}
      parts:
        unet: ltx25-unet-int8
        text_encoder: ltx25-text-encoder
        vae: ltx25-vae
        audio_vae: ltx25-audio-vae
        upscaler: ltx25-upscaler
    variants:
      - when: {backend: cuda}
        workflow: ltx
        files: [ltx25-unet-int8, ltx25-text-encoder, ltx25-vae, ltx25-audio-vae, ltx25-upscaler, film]

  ace-step:
    name: ACE-Step 1.5
    kind: music
    engine: ace-step
    license: mit
    summary: Beds, jingles and stingers from a few style tags. Instrumental or with lyrics.
    variants:
      - when: {backend: cuda}
        files: [ace-step-core, ace-step-lm]
      - when: {backend: mps}
        files: [ace-step-core, ace-step-lm]
        preview: true

  sa3-sfx:
    name: Stable Audio 3 SFX
    kind: sfx
    engine: stable-audio
    license: stability-community
    summary: One-shot sound effects in seconds. Foley, UI sounds, impacts, ambience.
    variants:
      - when: {backend: cuda}
        files: [sa3-sfx]
      - when: {backend: mps}
        files: [sa3-sfx]
        preview: true

  chatterbox-turbo:
    name: Chatterbox Turbo
    kind: clone
    engine: chatterbox
    license: mit
    summary: A voice from a short sample, with performed reactions like [laugh] and [sigh]. English.
    settings: {variant: turbo}
    variants:
      - when: {backend: cuda}
        files: [chatterbox-turbo]
      - when: {backend: mps}
        files: [chatterbox-turbo]
        preview: true

  chatterbox:
    name: Chatterbox
    kind: clone
    engine: chatterbox
    license: mit
    summary: A voice from a short sample, with dials for intensity and pacing. English.
    settings: {variant: classic}
    variants:
      - when: {backend: cuda}
        files: [chatterbox]
      - when: {backend: mps}
        files: [chatterbox]
        preview: true

  prompt-writer:
    name: Prompt Writer
    kind: prompt
    engine: prompt-writer
    license: apache-2.0
    summary: Rewrites a rough idea as a prompt the chosen model responds to, or describes a picture as one. Qwen3-VL 4B.
    variants:
      - when: {backend: cuda}
        files: [qwen3-vl-4b]
      - when: {backend: mps}
        files: [qwen3-vl-4b]
        preview: true

  kokoro:
    name: Kokoro
    kind: voice
    engine: kokoro
    license: apache-2.0
    summary: Narration in 28 preset English voices. Very fast, identical delivery every time.
    variants:
      - when: {}
        files: [kokoro-model, kokoro-config, kokoro-voices]

  z-image-turbo:
    name: Z-Image Turbo
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Quick, sharp pictures in 9 steps. Strong at photographs.
    settings: {prompt_style: zimage}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: z-image-nunchaku
        files: [zimage-int4, qwen3-4b, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: z-image-nunchaku
        files: [zimage-fp4, qwen3-4b, flux-ae]
      - when: {backend: mps}
        workflow: z-image-native
        files: [zimage-bf16, qwen3-4b, flux-ae]
        preview: true

  flux-schnell:
    name: FLUX.1 schnell
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Four steps to a finished image. Good for illustration and quick ideas.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [schnell-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [schnell-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux-schnell, steps: 4, guidance: null}

  qwen-image-fast:
    name: Qwen-Image Fast
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Qwen-Image's text and layout in four steps. Use it for drafts, then switch to Qwen-Image.
    settings: {prompt_style: qwen-image, steps: 4, cfg: 1.0, shift: 3.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-fast-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-fast-fp4, qwen25vl-fp8, qwen-image-vae]

  qwen-image:
    name: Qwen-Image
    kind: image
    engine: comfy
    license: apache-2.0
    summary: The one to use for words in pictures. Logos, signs, posters, labels. Eight steps.
    settings: {prompt_style: qwen-image, steps: 8, cfg: 1.0, shift: 3.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-8step-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-8step-fp4, qwen25vl-fp8, qwen-image-vae]

  flux-dev:
    name: FLUX.1 dev
    kind: image
    engine: comfy
    license: flux-dev-nc
    summary: Detailed images in 20 steps. Works best with a full description. Non-commercial.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [flux-dev-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [flux-dev-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux, steps: 20, guidance: 3.5, shift: true}

  flux-krea:
    name: FLUX.1 Krea
    kind: image
    engine: comfy
    license: flux-dev-nc
    summary: Photoreal without the glossy "AI look". Non-commercial.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [flux-krea-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [flux-krea-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux, steps: 28, guidance: 4.5, shift: true}

  krea-2:
    name: Krea 2
    kind: image
    engine: comfy
    license: krea-2-community
    summary: Photographs with natural skin, hands and fur, even from a short prompt. Eight steps, about ten seconds.
    variants:
      - when: {backend: cuda, quant: int4, cuda_tag: cu130}
        workflow: krea2
        files: [krea2-turbo-w4a4, krea2-text-encoder, qwen-image-vae]
      - when: {backend: cuda, quant: fp4, cuda_tag: cu130}
        workflow: krea2
        files: [krea2-turbo-w4a4, krea2-text-encoder, qwen-image-vae]
    settings: {prompt_style: krea2, steps: 8, cfg: 1.0}
