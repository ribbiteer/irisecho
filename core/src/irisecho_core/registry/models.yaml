# IrisEcho model registry.
#
# repos:    each source repository, pinned to a commit
# files:    individual weight files; `category` is the folder they land in
# licenses: shown in the app next to every model that uses them
# models:   what people pick in the app, with one variant per kind of machine
#
# Hashes and sizes live in lock.json, generated by scripts/lock_registry.py.
# A file without a lock entry cannot be downloaded.

