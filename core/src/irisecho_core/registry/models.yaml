models:
  qwen-edit-fast:
    name: Qwen Edit Fast
    kind: edit
    engine: comfy
    license: apache-2.0
    summary: Change a picture by describing the change. Four steps, about fifteen seconds.
    settings: {prompt_style: qwen-edit, steps: 4, cfg: 1.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-edit
        files: [qwen-edit-fast-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-edit
        files: [qwen-edit-fast-fp4, qwen25vl-fp8, qwen-image-vae]

  qwen-edit:
    name: Qwen Edit
    kind: edit
    engine: comfy
    license: apache-2.0
    summary: The careful version. Twenty steps for finished work; combine up to three pictures.
    settings: {prompt_style: qwen-edit, steps: 20, cfg: 2.5}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-edit
        files: [qwen-edit-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-edit
        files: [qwen-edit-fp4, qwen25vl-fp8, qwen-image-vae]

  flux-kontext:
    name: FLUX.1 Kontext
    kind: edit
    engine: comfy
    license: flux-dev-nc
    summary: Restyle or retouch while keeping what matters. Say only what should change. Non-commercial.
    settings: {prompt_style: kontext, steps: 8, guidance: 2.5}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: kontext
        files: [kontext-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: kontext
        files: [kontext-fp4, t5xxl-fp8, clip-l, flux-ae]

  seedvr2:
    name: SeedVR2
    kind: upscale
    engine: comfy
    license: apache-2.0
    summary: Restores detail and enlarges 2, 3 or 4 times. No prompt needed.
    variants:
      - when: {backend: cuda}
        workflow: seedvr2
        files: [seedvr2-3b, seedvr2-vae]

  wan22-i2v:
    name: Wan 2.2 from a picture
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Brings a still to life. Give a first frame, a last frame, or both.
    settings: {prompt_style: wan-i2v, mode: i2v}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-i2v-high, wan-i2v-low, wan-i2v-lora-high, wan-i2v-lora-low, wan-umt5, wan-vae, film]

  wan22-t2v:
    name: Wan 2.2 from text
    kind: video
    engine: comfy
    license: apache-2.0
    summary: A short clip from a description alone.
    settings: {prompt_style: wan-t2v, mode: t2v}
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-t2v-high, wan-t2v-low, wan-t2v-lora-high, wan-t2v-lora-low, wan-umt5, wan-vae, film]

  ace-step:
    name: ACE-Step 1.5
    kind: music
    engine: ace-step
    license: mit
    summary: Beds, jingles and stingers from a few style tags. Instrumental or with lyrics.
    variants:
      - when: {backend: cuda}
        files: [ace-step-core, ace-step-lm]
      - when: {backend: mps}
        files: [ace-step-core, ace-step-lm]
        preview: true

  sa3-sfx:
    name: Stable Audio 3 SFX
    kind: sfx
    engine: stable-audio
    license: stability-community
    summary: One-shot sound effects in seconds. Foley, UI sounds, impacts, ambience.
    variants:
      - when: {backend: cuda}
        files: [sa3-sfx]
      - when: {backend: mps}
        files: [sa3-sfx]
        preview: true

  chatterbox-turbo:
    name: Chatterbox Turbo
    kind: clone
    engine: chatterbox
    license: mit
    summary: A voice from a short sample, with performed reactions like [laugh] and [sigh]. English.
    settings: {variant: turbo}
    variants:
      - when: {backend: cuda}
        files: [chatterbox-turbo]
      - when: {backend: mps}
        files: [chatterbox-turbo]
        preview: true

  chatterbox:
    name: Chatterbox
    kind: clone
    engine: chatterbox
    license: mit
    summary: A voice from a short sample, with dials for intensity and pacing. English.
    settings: {variant: classic}
    variants:
      - when: {backend: cuda}
        files: [chatterbox]
      - when: {backend: mps}
        files: [chatterbox]
        preview: true

  prompt-writer:
    name: Prompt Writer
    kind: prompt
    engine: prompt-writer
    license: apache-2.0
    summary: Rewrites a rough idea as a prompt the chosen model responds to, or describes a picture as one. Qwen3-VL 4B.
    variants:
      - when: {backend: cuda}
        files: [qwen3-vl-4b]
      - when: {backend: mps}
        files: [qwen3-vl-4b]
        preview: true

  kokoro:
    name: Kokoro
    kind: voice
    engine: kokoro
    license: apache-2.0
    summary: Narration in 28 preset English voices. Very fast, identical delivery every time.
    variants:
      - when: {}
        files: [kokoro-model, kokoro-config, kokoro-voices]

  z-image-turbo:
    name: Z-Image Turbo
    kind: image
    engine: comfy
    license: apache-2.0
    summary: The fastest way to a good picture. 9 steps, strong at photographs.
    settings: {prompt_style: zimage}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: z-image-nunchaku
        files: [zimage-int4, qwen3-4b, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: z-image-nunchaku
        files: [zimage-fp4, qwen3-4b, flux-ae]
      - when: {backend: mps}
        workflow: z-image-native
        files: [zimage-bf16, qwen3-4b, flux-ae]
        preview: true

  flux-schnell:
    name: FLUX.1 schnell
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Four steps to a finished image. Good for illustration and quick ideas.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [schnell-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [schnell-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux-schnell, steps: 4, guidance: null}

  qwen-image:
    name: Qwen-Image
    kind: image
    engine: comfy
    license: apache-2.0
    summary: The one to use for words in pictures. Logos, signs, posters, labels.
    settings: {prompt_style: qwen-image}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
