# Files that several models use, by id (a model's `files` may list one of these lists).
x-files:
  ace-step-shared: &ace-step-shared
    - ace-step-core/config.json
    - ace-step-core/vae/config.json
    - ace-step-core/vae/diffusion_pytorch_model.safetensors
    - ace-step-core/Qwen3-Embedding-0.6B/added_tokens.json
    - ace-step-core/Qwen3-Embedding-0.6B/chat_template.jinja
    - ace-step-core/Qwen3-Embedding-0.6B/config.json
    - ace-step-core/Qwen3-Embedding-0.6B/merges.txt
    - ace-step-core/Qwen3-Embedding-0.6B/model.safetensors
    - ace-step-core/Qwen3-Embedding-0.6B/special_tokens_map.json
    - ace-step-core/Qwen3-Embedding-0.6B/tokenizer.json
    - ace-step-core/Qwen3-Embedding-0.6B/tokenizer_config.json
    - ace-step-core/Qwen3-Embedding-0.6B/vocab.json

# Advanced controls shared by several models (anchors; see `controls:` under each model).
# A control left unset gives the model's recommended behaviour, which is its `default`.
x-controls:
  audio-format: &audio-format
    name: format
    type: choice
    default: wav16
    options:
      - {value: wav16, label: WAV 16-bit}
      - {value: wav24, label: WAV 24-bit}
      - {value: flac, label: FLAC}
    label: File format
    help: "16-bit WAV is the usual. 24-bit WAV keeps more detail for editing; FLAC is lossless and about half the size."
  flux-loras: &flux-loras
    name: loras
    type: loras
    family: flux
    default: []
    label: Add-ons (LoRA)
    help: Styles, characters or concepts trained for FLUX.1. Put .safetensors files in the loras folder of your models folder.
  zimage-loras: &zimage-loras
    name: loras
    type: loras
    family: zimage
    default: []
    label: Add-ons (LoRA)
    help: Styles, characters or concepts trained for Z-Image. Plain LoRAs only (not LoKr or LoHa).
  size: &size-1mp
    name: megapixels
    type: float
    min: 0.5
    max: 2.0
    step: 0.1
    default: 1.0
    unit: MP
    label: Size
    help: How many pixels. Bigger takes longer and can repeat things in the picture; about 2 MP is the most a 12 GB card fits.
  edit-size: &edit-size
    name: megapixels
    type: float
    min: 0.5
    max: 2.0
    step: 0.1
    default: 1.0
    unit: MP
    label: Working size
    help: The size the picture is edited at. The result comes out at this size, in the picture's own shape.
  scheduler: &scheduler
    name: scheduler
    type: choice
    tier: expert
    default: simple
    options: [simple, beta, sgm_uniform, normal]
    label: Scheduler
    help: How the steps are spread from noise to finish. "simple" is what this model was tuned with.
  flux-sampler: &flux-sampler
    name: sampler
    type: choice
    tier: expert
    default: euler
    options: [euler, dpmpp_2m, deis, heun]
    label: Sampler
    help: The method that removes noise at each step. "euler" is what this model was tuned with; heun takes twice as long.
  qwen-sampler: &qwen-sampler
    name: sampler
    type: choice
    tier: expert
    default: euler
    options: [euler, res_multistep, dpmpp_2m]
    label: Sampler
    help: The method that removes noise at each step. "euler" is what this model was tuned with.
  flux-shift: &flux-shift
    name: max_shift
    type: float
    tier: expert
    min: 0.5
    max: 2.0
    step: 0.05
    default: 1.15
    label: Shift
    help: Higher spends more of the steps on overall shapes, lower on fine detail.
  video-quality: &video-quality
    name: video_quality
    type: choice
    default: standard
    options:
      - {value: standard, label: Standard}
      - {value: high, label: High}
      - {value: max, label: Very high}
    label: Video quality
    help: "How finely the clip is encoded. Standard is compact (about 2 to 3 Mbps at 720p) and can show blocks in fine texture and bands in smooth skies; High keeps them clean at about twice the size; Very high is for editing and grading afterwards, at about three times."
  qwen21-steps: &qwen21-steps
    name: steps
    type: int
    min: 4
    max: 12
    default: 8
    label: Steps
    help: "More is slower and sometimes finer. This model is tuned for 8; other counts stretch its schedule to fit."
  qwen21-loras: &qwen21-loras
    name: loras
    type: loras
    family: qwen-image-21
    default: []
    label: Add-ons (LoRA)
    help: Styles, characters or concepts trained for Qwen-Image 2.1. Add-ons for the first Qwen-Image do not fit it.
  qwen21-scheduler: &qwen21-scheduler
    name: scheduler
    type: choice
    tier: expert
    default: shipped
    options:
      - {value: shipped, label: The model's own}
      - {value: simple, label: simple}
      - {value: beta, label: beta}
      - {value: normal, label: normal}
      - {value: sgm_uniform, label: sgm_uniform}
    label: Scheduler
    help: How the steps are spread from noise to finish. This model ships with a schedule of its own; the others were not tested by its makers.

# How many takes and how long (seconds) a job may ask for, per model. A value outside
# the range is refused when the job is submitted; `default` is what a job that leaves
# it out gets. Models list the set they use as `settings.limits`.
x-limits:
  ace: &limits-ace
    takes: {min: 1, max: 4, default: 1}
    # 480 s is ACE-Step's own most with its planner on a 12 GB card (gpu_config.py). Asked for
    # 600 s there, ace-step ran out of memory and ace-step-xl made 482 s (rendered 2026-11-10).
    duration: {min: 10, max: 480, default: 30}
  comfy-music: &limits-comfy-music
    takes: {min: 1, max: 4, default: 1}
    duration: {min: 10, max: 300, default: 30}
  # The model is conditioned on lengths up to 384 s; 360 s was rendered on a 12 GB card.
  sa3-medium: &limits-sa3-medium
    takes: {min: 1, max: 4, default: 1}
    duration: {min: 10, max: 360, default: 30}
  sfx: &limits-sfx
    takes: {min: 1, max: 4, default: 3}
    duration: {min: 0.5, max: 30, default: 3}
  clone: &limits-clone
    takes: {min: 1, max: 4, default: 1}
  video: &limits-video
    seconds: {min: 2, max: 5, default: 3}

models:
  qwen-image-21-edit:
    name: Qwen-Image 2.1
    kind: edit
    engine: comfy
    license: qwen-research
    summary: Qwen-Image 2.1 editing a picture, up to 4 MP. Combine up to ten pictures, or change up to three marked areas. The pictures are yours to use.
    settings: {prompt_style: qwen-image-21-edit, steps: 8, cfg: 1.0, edit: {pictures: 10, areas: 3}}
    variants:
      - when: {backend: cuda, cuda_tag: cu130}
        workflow: qwen21-edit
        files: [qwen21-turbo-int8, qwen3vl-8b-w4a8, qwen21-vae]
    controls:
      - *qwen21-steps
      - {name: megapixels, type: float, min: 0.5, max: 4.0, step: 0.1, default: 2.0, unit: MP, label: Working size, help: "The size the picture is edited at. The result comes out at this size, in the picture's own shape; up to 4 MP fits a 12 GB card."}
      - {name: feather, type: int, min: 0, max: 31, default: 12, unit: px, needs: box, label: Soft edge, help: "How gradually the changed area blends into the rest when you change only an area. 0 is a hard edge."}
      - {name: ref_megapixels, type: float, tier: expert, min: 0.25, max: 4.0, step: 0.05, default: 2.0, unit: MP, needs: image2, label: Size of the other pictures, help: "The size Pictures 2 and up are read at, up to 4 MP like Picture 1. Unset, they follow the working size while together they stay within 3.3 MP (1.65 MP each for two, 0.37 MP each for nine), which keeps a ten-picture edit to about a minute and a quarter on a 12 GB card. Larger keeps more of their fine detail but is slower, and many large pictures together can take many minutes."}
      - {name: transparent, type: bool, default: false, label: Keep transparency, help: "Saves the result with a transparent background when the edit asks for one, such as 'remove the background'. Off, a result keeps transparency only when part of it really came out clear. Changing only an area always gives an opaque picture."}
      - *qwen21-loras
      - {name: cache, type: choice, tier: expert, default: auto, options: [auto, gpu, cpu, "off"], label: Reference memory, help: "Where the model keeps what it read from the prompt and pictures between steps. auto uses spare graphics memory, then RAM; off reads them again at every step, slower but the plainest."}
      - *qwen-sampler
      - *qwen21-scheduler

  qwen-edit:
    name: Qwen Edit
    kind: edit
    engine: comfy
    license: apache-2.0
    summary: The careful version. Eight steps for finished work; combine up to three pictures.
    settings: {prompt_style: qwen-edit, steps: 8, cfg: 1.0, edit: {pictures: 3, areas: 1}}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-edit
        files: [qwen-edit-8step-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-edit
        files: [qwen-edit-8step-fp4, qwen25vl-fp8, qwen-image-vae]
    controls:
      - {name: steps, type: int, min: 6, max: 10, default: 8, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 8."}
      - *edit-size
      - {name: keep_size, type: bool, default: false, label: Keep the exact framing, help: "Edits at a size the model reads without rescaling, so the unchanged parts line up with the original instead of shifting a few pixels."}
      - {name: feather, type: int, min: 0, max: 31, default: 12, unit: px, needs: box, label: Soft edge, help: "How gradually the changed area blends into the rest when you change only an area. 0 is a hard edge."}
      - {name: shift, type: float, tier: expert, min: 2, max: 5, step: 0.1, default: 3.0, label: Shift, help: "Higher favours overall shapes, lower favours fine detail."}
      - *qwen-sampler
      - *scheduler

  qwen-edit-fast:
    name: Qwen Edit Fast
    kind: edit
    engine: comfy
    license: apache-2.0
    summary: Change a picture by describing the change. Four steps, about fifteen seconds.
    settings: {prompt_style: qwen-edit, steps: 4, cfg: 1.0, edit: {pictures: 3, areas: 1}}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-edit
        files: [qwen-edit-fast-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-edit
        files: [qwen-edit-fast-fp4, qwen25vl-fp8, qwen-image-vae]
    controls:
      - {name: steps, type: int, min: 2, max: 6, default: 4, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 4."}
      - *edit-size
      - {name: keep_size, type: bool, default: false, label: Keep the exact framing, help: "Edits at a size the model reads without rescaling, so the unchanged parts line up with the original instead of shifting a few pixels."}
      - {name: feather, type: int, min: 0, max: 31, default: 12, unit: px, needs: box, label: Soft edge, help: "How gradually the changed area blends into the rest when you change only an area. 0 is a hard edge."}
      - {name: shift, type: float, tier: expert, min: 2, max: 5, step: 0.1, default: 3.0, label: Shift, help: "Higher favours overall shapes, lower favours fine detail."}
      - *qwen-sampler
      - *scheduler

  flux-kontext:
    name: FLUX.1 Kontext
    kind: edit
    engine: comfy
    license: flux-dev-nc
    summary: Restyle or retouch while keeping what matters. Say only what should change. Non-commercial.
    settings: {prompt_style: kontext, steps: 20, guidance: 2.5, edit: {pictures: 1, areas: 0}}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: kontext
        files: [kontext-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: kontext
        files: [kontext-fp4, t5xxl-fp8, clip-l, flux-ae]
    controls:
      - {name: guidance, type: float, min: 1.5, max: 4, step: 0.1, default: 2.5, label: Follow the prompt, help: "Higher sticks closer to your words and adds contrast; lower looks more natural."}
      - {name: steps, type: int, min: 12, max: 40, default: 20, label: Steps, help: "More is slower and sometimes finer. 20 is recommended."}
      - *flux-loras
      - *flux-sampler
      - *scheduler

  seedvr2:
    name: SeedVR2
    kind: upscale
    engine: comfy
    license: apache-2.0
    summary: Restores detail and enlarges 2, 3 or 4 times. No prompt needed.
    variants:
      - when: {backend: cuda}
        workflow: seedvr2
        files: [seedvr2-3b, seedvr2-vae]
    controls:
      - &upscale-color
        name: color
        type: choice
        default: lab
        options:
          - {value: lab, label: True to the original}
          - {value: wavelet, label: Keep the new detail}
          - {value: adain, label: Overall tint}
          - {value: none, label: No correction}
        label: Colour matching
        help: "How the colours of the result are matched to your picture. \"True to the original\" is safest; \"Keep the new detail\" lets the restored texture win where they disagree; \"No correction\" shows the raw result."
      - {name: tile, type: choice, tier: expert, default: 512, options: [{value: 512, label: "512 (default)"}, {value: 768, label: "768"}, {value: 1024, label: "1024"}], label: Tile size, help: "The size of the pieces a big picture is worked in. Bigger pieces mean fewer visible seams but need more graphics memory; go back to 512 if it runs out."}

  seedvr2-7b:
    name: SeedVR2 7B
    kind: upscale
    engine: comfy
    license: apache-2.0
    summary: The larger SeedVR2. Slower, with finer restored detail than the standard one, and it needs an 8 GB download.
    variants:
      - when: {backend: cuda}
        workflow: seedvr2
        files: [seedvr2-7b, seedvr2-vae]
    controls:
      - *upscale-color
      - {name: tile, type: choice, tier: expert, default: 512, options: [{value: 512, label: "512 (default)"}, {value: 768, label: "768"}, {value: 1024, label: "1024"}], label: Tile size, help: "The size of the pieces a big picture is worked in. Bigger pieces mean fewer visible seams but need more graphics memory; go back to 512 if it runs out."}

  seedvr2-video:
    name: SeedVR2 Video
    kind: video-upscale  # not a studio: reached through the API and the command line only
    engine: comfy
    license: apache-2.0
    summary: Restores detail in a whole clip and enlarges it to 1080p. Experimental; it can make faces look plastic and add grit and flicker, so compare it with a plain resize.
    variants:
      - when: {backend: cuda}
        workflow: seedvr2-video
        files: [seedvr2-3b, seedvr2-vae]
    controls:
      - *upscale-color
      - *video-quality

  pixal3d:
    name: Pixal3D
    kind: model3d
    engine: comfy
    license: pixal3d-dinov3
    summary: Builds a 3D model from a front and a back picture taken at eye level; IrisEcho can make the back for you. The most complete shapes and the truest backs.
    settings:
      model3d: {views: [front, back], pace: {standard: 160, high: 230}}
    variants:
      - when: {backend: cuda}
        workflow: pixal3d-mv
        files: [pixal3d-mv-int8, trellis2-shape-vae, trellis2-texture-vae, dinov3-naf, birefnet]
    controls:
      - &m3d-triangles {name: triangles, type: int, min: 5000, max: 1000000, step: 5000, default: 500000, unit: triangles, label: Exact triangle count, help: "Overrides the triangle choice above. Game models are usually 5,000 to 50,000; 3D printing 200,000 or more. Very low counts can fail to export."}
      - &m3d-texture {name: texture_size, type: choice, default: 2048, options: [{value: 1024, label: "1024 (smaller file)"}, {value: 2048, label: "2048 (default)"}], label: Texture size, help: "The width of the painted surface in pixels. 1024 makes a smaller file; 2048 keeps finer print."}
      - &m3d-smoothing {name: smoothing, type: int, min: 0, max: 8, step: 1, default: 3, label: Surface smoothing, help: "Rounds off the bumps of the raw shape. Lower keeps sharp edges and any streaks; higher gives a softer, more organic surface."}
      - &m3d-crease {name: crease, type: choice, tier: expert, default: 180, options: [{value: 180, label: "Smooth everywhere (default)"}, {value: 60, label: "Sharp edges above 60 degrees"}, {value: 30, label: "Sharp edges above 30 degrees"}], label: Shading of edges, help: "Where the shading shows a hard edge. Smooth suits creatures and figures; the sharp settings suit boxes, gears and other hard-surface things, especially at low triangle counts."}
      - &m3d-small {name: keep_small, type: choice, tier: expert, default: 0.01, options: [{value: 0, label: Keep every loose part}, {value: 0.01, label: "Drop tiny loose parts (default)"}, {value: 0.05, label: Drop small loose parts}], label: Drop small loose parts, help: "Separate bits much smaller than the main model are thrown away as specks. Keep every loose part if your object has floating pieces such as a hovering sword or detached buttons."}
      - &m3d-steps {name: steps, type: int, tier: expert, min: 8, max: 30, default: 12, label: Steps, help: "How many refinement steps each of the three stages takes. More is slower (a few seconds per step) and not always better. 12 is what the model was tuned with."}
      - &m3d-guidance {name: guidance, type: float, tier: expert, min: 3, max: 10, step: 0.5, default: 7.5, label: Follow the picture, help: "How strictly the shape follows your picture. Higher is more literal; lower is looser and can look less over-baked. The painting stage is not affected."}

  trellis2:
    name: TRELLIS.2
    kind: model3d
    engine: comfy
    license: trellis2-dinov3
    summary: Builds a 3D model from one picture taken from any angle. Keeps your object's details and stands it upright; the back is guessed.
    settings:
      model3d: {views: [front], pace: {standard: 170, high: 240}}
    variants:
      - when: {backend: cuda}
        workflow: trellis2
        files: [trellis2-int8, trellis2-shape-vae, trellis2-texture-vae, dinov3-naf, birefnet]
    controls:
      - *m3d-triangles
      - *m3d-texture
      - *m3d-smoothing
      - *m3d-crease
      - *m3d-small
      - *m3d-steps
      - *m3d-guidance

  pixal3d-single:
    name: Pixal3D from one picture
    kind: model3d
    engine: comfy
    license: pixal3d-moge
    summary: Builds a 3D model from one picture, with Pixal3D's own shape model and a camera-angle estimate. A different take to compare with TRELLIS.2; for eye-level pictures. Needs a 6 GB download.
    settings:
      # pace copied from pixal3d and trellis2, not measured
      model3d: {views: [front], pace: {standard: 165, high: 235}}
    variants:
      - when: {backend: cuda}
        workflow: pixal3d-single
        files: [pixal3d-int8, moge2-vitl-normal, trellis2-shape-vae, trellis2-texture-vae, dinov3-naf, birefnet]
    controls:
      - *m3d-triangles
      - *m3d-texture
      - *m3d-smoothing
      - *m3d-crease
      - *m3d-small
      - *m3d-steps
      - *m3d-guidance

  object-views:
    name: View Maker
    kind: views3d  # a helper for the 3D studio, not a studio of its own
    engine: comfy
    license: apache-2.0
    summary: Makes the eye-level front and the matching back view that Pixal3D builds from, and checks that they fit together. Uses the same files as Qwen Edit.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: views3d
        files: [qwen-edit-8step-int4, qwen25vl-fp8, qwen-image-vae, birefnet]
      - when: {backend: cuda, quant: fp4}
        workflow: views3d
        files: [qwen-edit-8step-fp4, qwen25vl-fp8, qwen-image-vae, birefnet]
    controls:
      - {name: back_words, type: text, default: "", label: Describe the back, help: "Words about what the back of your object looks like, for example \"a zipper down the middle and two pockets\". Added to the instruction that draws the back view."}

  ltx25:
    name: LTX-2.5
    kind: video
    engine: comfy
    license: ltx-2x-community
    summary: Picture and sound in one take, from a description, a first frame, a last frame or both. The fastest; best with a long, detailed prompt.
    settings:
      prompt_style: ltx
      sampler: euler_ancestral
      video: {frames: [start, end], sizes: [standard, large, 720p], fps: 24, sound: true, pace: {standard: 20, large: 22, 720p: 25}}
      limits: *limits-video
      parts:
        unet: ltx25-unet-int8
        text_encoder: ltx25-text-encoder
        vae: ltx25-vae
        audio_vae: ltx25-audio-vae
        upscaler: ltx25-upscaler
    variants:
      - when: {backend: cuda}
        workflow: ltx
        files: [ltx25-unet-int8, ltx25-text-encoder, ltx25-vae, ltx25-audio-vae, ltx25-upscaler, film]
    controls:
      - {name: motion, type: int, min: 0, max: 50, step: 1, default: 18, label: Allow more motion, help: "Higher lets the clip move further away from your picture; lower keeps it closer to the picture and calmer."}
      - {name: start_strength, type: float, min: 0.5, max: 1.0, step: 0.05, default: 0.7, needs: start, label: Hold the first picture, help: "How tightly the first frame is held. Lower gives the clip more freedom to change (looser likeness, more movement); 1 pins it."}
      - {name: end_strength, type: float, min: 0.3, max: 1.0, step: 0.05, default: 0.7, needs: end, label: Hold the last picture, help: "How tightly the last frame is held. Lower lets the clip drift away from it; higher makes it land exactly there."}
      - {name: sound, type: bool, default: true, label: Make sound, help: "Switch off for a silent clip."}
      - {name: sampler, type: choice, tier: expert, default: euler_ancestral, options: [euler_ancestral, euler], label: Sampler, help: "The method that removes noise at each step. euler_ancestral is what this model was tuned with; euler is steadier between seeds."}
      - &video-interpolation {name: interpolation, type: choice, needs: smooth, default: 2, options: [{value: 2, label: "2x (default)"}, {value: 4, label: "4x (slower)"}], label: Smoothing amount, help: "How many frames the Smooth option adds between each pair. 4x is silkier and takes longer, and the file gets larger."}
      - {name: even_sound, type: bool, default: false, label: Even out the sound level, help: "LTX makes ambience such as water, wind or birds very quietly (around -50 LUFS, close to silent) while speech comes out loud. This brings the sound to the level IrisEcho uses for speech, with peaks kept below -1 dB."}
      - *video-quality

  wan22-i2v:
    name: Wan 2.2 from a picture
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Brings a still to life. Give a first frame, a last frame, or both.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      experts: wan-i2v-distilled
      distill: merged
      video: {frames: [start, end], needs_frame: true, sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 25, large: 40, 720p: 75}}
      limits: *limits-video
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-i2v-distilled-high, wan-i2v-distilled-low, wan-umt5, wan-vae, film]
    controls:
      - &wan-loras {name: loras, type: loras, family: wan14b, pair: true, default: [], label: Add-ons (LoRA), help: "Camera, style or motion add-ons made for Wan 2.2 14B. Each needs a high-noise and a low-noise file (put them in the loras folder of your models folder)."}
      - *video-interpolation
      - *video-quality

  wan22-i2v-1022:
    name: Wan 2.2 camera moves
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Bigger camera moves that keep faces intact. A last frame sets where the move ends.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      distill: "1022"
      video: {frames: [start, end], needs_frame: true, sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 35, large: 50, 720p: 95}}
      limits: *limits-video
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-i2v-high, wan-i2v-low, wan-i2v-lora-1022-high, wan-i2v-lora-1022-low, wan-umt5, wan-vae, film]
    controls:
      - &wan-distill-high {name: distill_high, type: float, min: 0.5, max: 1.4, step: 0.05, default: 1.0, label: "Speed-up strength, high noise", help: "Strength of the four-step speed-up on the first half of the clip's making, which sets the motion. Lowering it (0.6 to 0.8) is the usual fix when the motion looks slow."}
      - &wan-distill-low {name: distill_low, type: float, min: 0.5, max: 1.4, step: 0.05, default: 1.0, label: "Speed-up strength, low noise", help: "Strength of the four-step speed-up on the second half, which sets the fine detail. Change it only if the details look off."}
      - *wan-loras
      - *video-interpolation
      - *video-quality

  wan22-t2v:
    name: Wan 2.2 from text
    kind: video
    engine: comfy
    license: apache-2.0
    summary: A short clip from a description alone.
    settings:
      prompt_style: wan-t2v
      mode: t2v
      distill: "1217"
      video: {frames: [], sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 30, large: 45, 720p: 90}}
      limits: *limits-video
    variants:
      - when: {backend: cuda}
        workflow: wan22
        files: [wan-t2v-high, wan-t2v-low, wan-t2v-lora-1217-high, wan-t2v-lora-1217-low, wan-umt5, wan-vae, film]
    controls:
      - *wan-distill-high
      - *wan-distill-low
      - *wan-loras
      - *video-interpolation
      - *video-quality

  wan22-camera:
    name: Wan 2.2 camera control
    kind: video
    engine: comfy
    license: apache-2.0
    summary: Moves the camera the way you choose (pan, zoom, roll) through the scene of your first frame. Needs a first frame and a 30 GB download.
    settings:
      prompt_style: wan-i2v
      # pace guessed from wan22-i2v (same fp8 experts, same four steps), not measured
      video: {frames: [start], needs_frame: true, sizes: [standard, large, 720p], fps: 16, sound: false, pace: {standard: 25, large: 40, 720p: 75}}
      limits: *limits-video
    variants:
      - when: {backend: cuda}
        workflow: wan22-camera
        files: [wan-fun-camera-high, wan-fun-camera-low, wan-i2v-lora-v1-high, wan-i2v-lora-v1-low, wan-umt5, wan-vae, film]
    controls:
      - {name: camera_speed, type: float, min: 0.2, max: 3.0, step: 0.1, default: 1.0, label: Camera speed, help: "How far the camera travels over the clip. 1 is the usual; lower is a gentle drift, higher a bigger move that can smear the scene. Does nothing for a static camera."}
      - *wan-loras
      - *video-interpolation
      - *video-quality

  hunyuan15-i2v:
    name: HunyuanVideo 1.5 from a picture
    kind: video
    engine: comfy
    license: tencent-hunyuan-community
    summary: The most natural faces and hands from a first frame. Slower than Wan, and silent. Not licensed in the EU, UK or South Korea.
    settings:
      prompt_style: wan-i2v
      mode: i2v
      video: {frames: [start], needs_frame: true, sizes: [standard, 720p], fps: 24, sound: false, pace: {standard: 45, 720p: 165}}
      limits: *limits-video
    variants:
      - when: {backend: cuda}
        workflow: hunyuan15
        files: [hy15-i2v-480-distill, hy15-sr-720, hy15-upsampler-720, qwen25vl-fp8, hy15-byt5, hy15-vae, sigclip-384, film]
    controls:
      - {name: steps, type: choice, default: 8, options: [{value: 8, label: "8 steps (default)"}, {value: 12, label: "12 steps (slower)"}], label: Steps, help: "12 is the other value the makers recommend; it takes about half as long again for a possible gain in finish."}
      - {name: sr_noise, type: float, tier: expert, min: 0.4, max: 0.9, step: 0.05, default: 0.7, label: 720p re-imagining, help: "Only used by the 720p size. Lower stays closer to the first pass; higher lets the sharpening pass invent more."}
      - *video-interpolation
      - *video-quality

  ace-step:
    name: ACE-Step 1.5
    kind: music
    engine: ace-step
    license: mit
    summary: Beds, jingles and stingers from a few style tags. Instrumental or with lyrics.
    settings:
      limits: *limits-ace
    variants:
      - when: {backend: cuda}
        files: [ace-step-core, ace-step-lm]
      - when: {backend: mps}
        files: [ace-step-core, ace-step-lm]
        preview: true
    controls:
      - &ace-key
        name: key
        type: choice
        default: ""
        options:
          - {value: "", label: Any}
          - {value: C major, label: C major}
          - {value: C minor, label: C minor}
          - {value: C# major, label: C# major}
          - {value: C# minor, label: C# minor}
          - {value: D major, label: D major}
          - {value: D minor, label: D minor}
          - {value: D# major, label: D# major}
          - {value: D# minor, label: D# minor}
          - {value: E major, label: E major}
          - {value: E minor, label: E minor}
          - {value: F major, label: F major}
          - {value: F minor, label: F minor}
          - {value: F# major, label: F# major}
          - {value: F# minor, label: F# minor}
          - {value: G major, label: G major}
          - {value: G minor, label: G minor}
          - {value: G# major, label: G# major}
          - {value: G# minor, label: G# minor}
          - {value: A major, label: A major}
          - {value: A minor, label: A minor}
          - {value: A# major, label: A# major}
          - {value: A# minor, label: A# minor}
          - {value: B major, label: B major}
          - {value: B minor, label: B minor}
        label: Key
        help: "The musical key. Any lets the song planner choose. Useful when the music must fit with other tracks."
      - &ace-time-signature
        name: time_signature
        type: choice
        default: ""
        options:
          - {value: "", label: Any}
          - {value: "2", label: 2/4}
          - {value: "3", label: 3/4}
          - {value: "4", label: 4/4}
          - {value: "6", label: 6/8}
        label: Time signature
        help: "The beat pattern: 4/4 for most pop and dance, 3/4 for waltzes, 6/8 for a rolling feel. Any lets the song planner choose."
      - &ace-vocal-language
        name: vocal_language
        type: choice
        default: unknown
        needs: lyrics
        options:
          - {value: unknown, label: Detect from the lyrics}
          - {value: en, label: English}
          - {value: zh, label: Chinese}
          - {value: ja, label: Japanese}
          - {value: ko, label: Korean}
          - {value: es, label: Spanish}
          - {value: fr, label: French}
          - {value: de, label: German}
          - {value: it, label: Italian}
          - {value: pt, label: Portuguese}
          - {value: ru, label: Russian}
        label: Language of the lyrics
        help: "Set it when the singing comes out in the wrong language; otherwise the language is detected from the lyrics."
      - &ace-raw
        name: raw
        type: bool
        default: false
        label: Raw output
        help: "Skips ACE-Step's final level-setting (it raises or lowers each song to peak at -1 dB). Loops are still cut as asked, and a song that would clip is turned down just enough."
      - *audio-format
      - &ace-trim-end {name: trim_end, type: bool, default: false, label: Trim the silent ending, help: "Music models often finish a song a few seconds early and fills the rest with near-silence. This cuts that tail, keeping half a second with a short fade. Loops keep their exact length."}
      - &ace-steps {name: steps, type: int, tier: expert, min: 1, max: 20, default: 8, label: Steps, help: "More is slower. This model is tuned for 8; fewer is a quick draft."}
      - &ace-shift {name: shift, type: float, tier: expert, min: 1, max: 5, step: 0.1, default: 3.0, label: Shift, help: "How the steps are spread from noise to finished music. This model is tuned for 3."}
      - &ace-lm-temperature {name: lm_temperature, type: float, tier: expert, min: 0, max: 2, step: 0.05, default: 0.85, needs: thinking, label: Planner variety, help: "How adventurous the song planner is. Lower plans more predictably, higher more surprisingly. Only used while planning is on."}
      - &ace-lm-top-p {name: lm_top_p, type: float, tier: expert, min: 0, max: 1, step: 0.01, default: 0.9, needs: thinking, label: Planner focus, help: "Lower makes the song planner stick to its most likely choices. Only used while planning is on."}
      - &ace-cover-strength {name: cover_strength, type: float, tier: advanced, min: 0, max: 1, step: 0.01, default: 1.0, needs: source, label: How closely to follow the recording, help: "Only for a cover. 1 keeps the recording's tune and structure; lower, such as 0.2, gives more room for a new style."}
      - &ace-cover-noise {name: cover_noise, type: float, tier: expert, min: 0, max: 1, step: 0.01, default: 0.0, needs: source, label: Keep the melody, help: "Only for a cover. 0 starts from nothing but your style tags; raise it a little (0.1 to 0.25) to bring the recording's melody back. Higher keeps the tune but resists a change of style."}


  # Opt-in bigger ACE-Step: the 4B renderer and the 4B planner, made to fit a 12 GB card
  # by keeping only the one at work on the card (ACE-Step's CPU offload) and the renderer
  # in int8, as ACE-Step recommends for XL on 12 GB.
  ace-step-xl:
    name: ACE-Step 1.5 XL
    kind: music
    engine: ace-step
    license: mit
    summary: Richer, more detailed songs from ACE-Step's 4B renderer and its strongest song planner. About twice as slow.
    settings: &ace-step-xl-settings
      limits: *limits-ace
      dit: acestep-v15-xl-turbo
      dit_files: ace-step-xl-turbo
      lm: acestep-5Hz-lm-4B
      lm_files: ace-step-lm-4b
      quantization: int8_weight_only
      offload: true
      pass_seconds: 480
    variants:
      - when: {backend: cuda}
        files: [*ace-step-shared, ace-step-xl-turbo, ace-step-lm-4b]
    controls:
      - *ace-key
      - *ace-time-signature
      - *ace-vocal-language
      - *ace-raw
      - *audio-format
      - *ace-trim-end
      - *ace-steps
      - *ace-shift
      - *ace-lm-temperature
      - *ace-lm-top-p
      - *ace-cover-strength
      - *ace-cover-noise

  # The same with the SFT renderer: 50 steps with prompt guidance (CFG) instead of 8
  # distilled ones; settings as in ACE-Step's own app for SFT (shift 3, DCW off).
  ace-step-xl-sft:
    name: ACE-Step 1.5 XL SFT
    kind: music
    engine: ace-step
    license: mit
    summary: The most detailed ACE-Step, refining each song in 50 steps with prompt guidance. Several times slower; for finished pieces.
    settings:
      <<: *ace-step-xl-settings
      dit: acestep-v15-xl-sft
      dit_files: ace-step-xl-sft
      sft: true
      # Guidance renders every take twice in one batch, so a pass holds half of XL's.
      pass_seconds: 240
    variants:
      - when: {backend: cuda}
        files: [*ace-step-shared, ace-step-xl-sft, ace-step-lm-4b]
    controls:
      - *ace-key
      - *ace-time-signature
      - *ace-vocal-language
      - *ace-raw
      - *audio-format
      - *ace-trim-end
      - {name: steps, type: int, tier: expert, min: 10, max: 100, default: 50, label: Steps, help: "More is slower. This model is tuned for 50; fewer is quicker but rougher."}
      - *ace-shift
      - {name: cfg, type: float, tier: expert, min: 1, max: 15, step: 0.5, default: 7.0, label: Prompt strength, help: "How closely the music follows your style tags and lyrics. 7 is the model's usual; higher follows more literally but can sound forced."}
      - *ace-lm-temperature
      - *ace-lm-top-p
      - *ace-cover-strength
      - *ace-cover-noise
  # Music in ComfyUI. `music` tells the studio what a model takes; ACE-Step models have
  # none and keep every option. Instrumentals get section tags sized to the length
  # (`section_seconds`), as these models follow the tags for structure and length.
  # `ends_by`: about where YuE2 and MiniMax end an instrumental whatever the length asked
  # (240 s asked: YuE2 109-126 s, MiniMax 146-155 s, with denser tags or a long-form
  # description too); the studio says so above that length.
  yue2:
    name: YuE2
    kind: music
    engine: comfy
    license: cc-by-nc-4.0
    summary: Full songs with clean, lively mixes; plans a melody and chords first. English and Mandarin.
    settings:
      music: {lyrics: true, planner: true, source: false, loop: true, ends_by: 120}
      limits: *limits-comfy-music
      section_seconds: 20
    variants:
      - when: {backend: cuda}
        files: [yue2-3b]
        workflow: yue2
    controls:
      - *audio-format
      - *ace-trim-end
      - {name: steps, type: int, tier: expert, min: 8, max: 128, default: 32, label: Steps, help: "More is slower. ComfyUI's YuE2 template uses 32; 64 is a slower, finer pass."}

  minimax-music3:
    name: MiniMax Music 3
    kind: music
    engine: comfy
    license: minimax-music3-community
    summary: Songs and instrumentals up to 5 minutes with wide dynamics, from a detailed description.
    settings:
      music: {lyrics: true, planner: false, source: false, loop: true, ends_by: 150}
      limits: *limits-comfy-music
      section_seconds: 15
    variants:
      - when: {backend: cuda}
        files: [mm3-dit, mm3-text-encoder, mm3-vae]
        workflow: minimax-music3
    controls:
      - *audio-format
      - *ace-trim-end
      - {name: steps, type: int, tier: expert, min: 8, max: 60, default: 30, label: Steps, help: "More is slower. MiniMax's template uses 30."}

  sa3-medium:
    name: Stable Audio 3 Medium
    kind: music
    engine: comfy
    license: stability-community-open
    summary: Instrumentals up to 6 minutes in seconds; strong on jazz, orchestral and lo-fi beds. No vocals.
    settings:
      music: {lyrics: false, planner: false, source: false, loop: true}
      limits: *limits-sa3-medium
    variants:
      - when: {backend: cuda}
        files: [sa3-medium, sa3-t5gemma]
        workflow: sa3-music
    controls:
      - *audio-format
      - *ace-trim-end
      - {name: steps, type: int, tier: expert, min: 4, max: 50, default: 8, label: Steps, help: "More is slower. This model is tuned for 8."}

  sa3-sfx:
    name: Stable Audio 3 SFX
    kind: sfx
    engine: stable-audio
    license: stability-community
    summary: One-shot sound effects in seconds. Foley, UI sounds, impacts, ambience.
    settings: {prompt_style: sfx, limits: *limits-sfx}
    variants:
      - when: {backend: cuda}
        files: [sa3-sfx]
      - when: {backend: mps}
        files: [sa3-sfx]
        preview: true
    controls:
      - *audio-format
      - {name: steps, type: int, tier: expert, min: 1, max: 100, default: 8, label: Steps, help: "More is slower, and this model gains little past 8; fewer is quicker but rougher."}
      - {name: cfg, type: float, tier: expert, min: 0, max: 25, step: 0.1, default: 1.0, label: Prompt strength, help: "How strictly to follow the description. 1 is what this model is tuned for; raise it (try 3 to 7) to use the Leave out box."}
      - {name: negative, type: text, tier: expert, default: "", label: Leave out, help: "Things the sound should not have, such as music or speech. Only works when Prompt strength is above 1."}
      - {name: init_strength, type: float, tier: advanced, min: 0, max: 1, step: 0.05, default: 0.5, needs: init_audio, label: How much to change, help: "Only used with a starting sound. 0 stays closest to it (0.1 is a near copy), 1 ignores it and makes a new sound from the description."}
      - {name: track_type, type: bool, tier: expert, default: true, label: Sound-effect tag, help: "Starts the description with the tag the model's guide recommends for sound effects. Turn it off if your description already says what kind of sound it is."}

  chatterbox-turbo:
    name: Chatterbox Turbo
    kind: clone
    engine: chatterbox
    license: mit
    summary: A voice from a short sample, with performed reactions like [laugh] and [sigh]. English.
    settings: {variant: turbo, limits: *limits-clone}
    variants:
      - when: {backend: cuda}
        files: [chatterbox-turbo]
      - when: {backend: mps}
        files: [chatterbox-turbo]
        preview: true
    controls:
      - {name: temperature, type: float, min: 0.05, max: 2, step: 0.05, default: 0.8, label: Variation, help: "Lower is steadier and flatter, higher is livelier and riskier. Raise it a little if the voice sounds monotone."}
      - {name: repetition_penalty, type: float, min: 1, max: 2, step: 0.05, default: 1.2, label: Repeat guard, help: "Raise it if words loop or stutter."}
      - *audio-format
      - {name: top_p, type: float, tier: expert, min: 0, max: 1, step: 0.05, default: 0.95, label: Top-p, help: "Only the likeliest speech sounds are considered; lower is safer and more uniform."}
      - {name: top_k, type: int, tier: expert, min: 0, max: 1000, step: 10, default: 1000, label: Top-k, help: "How many candidates are considered for each sound. 0 turns the limit off."}

  chatterbox:
    name: Chatterbox
    kind: clone
    engine: chatterbox
    license: mit
    summary: A voice from a short sample, with dials for intensity and pacing. English.
    settings: {variant: classic, limits: *limits-clone}
    variants:
      - when: {backend: cuda}
        files: [chatterbox]
      - when: {backend: mps}
        files: [chatterbox]
        preview: true
    controls:
      - {name: temperature, type: float, min: 0.05, max: 5, step: 0.05, default: 0.8, label: Variation, help: "Lower is steadier and flatter, higher is livelier and riskier. Raise it a little if the voice sounds monotone."}
      - {name: repetition_penalty, type: float, min: 1, max: 2, step: 0.05, default: 1.2, label: Repeat guard, help: "Raise it if words loop or stutter."}
      - *audio-format
      - {name: min_p, type: float, tier: expert, min: 0, max: 1, step: 0.01, default: 0.05, label: Min-p, help: "Drops very unlikely speech sounds. 0.02 to 0.1 works well, and it copes better with a higher Variation."}
      - {name: top_p, type: float, tier: expert, min: 0, max: 1, step: 0.05, default: 1.0, label: Top-p, help: "1 turns it off. Lower keeps only the likeliest speech sounds."}

  prompt-writer:
    name: Prompt Writer
    kind: prompt
    engine: prompt-writer
    license: apache-2.0
    summary: Rewrites a rough idea as a prompt the chosen model responds to, or describes a picture as one. Qwen3-VL 4B.
    variants:
      - when: {backend: cuda}
        files: [qwen3-vl-4b]
      - when: {backend: mps}
        files: [qwen3-vl-4b]
        preview: true

  kokoro:
    name: Kokoro
    kind: voice
    engine: kokoro
    license: apache-2.0
    summary: Narration in 28 preset English voices. Very fast, identical delivery every time.
    variants:
      - when: {}
        files: [kokoro-model, kokoro-config, kokoro-voices]
    controls:
      - {name: blend, type: text, default: "", label: Mix voices, help: "Mix several voices into a new one, replacing the voice chosen above. Write voice names, optionally with weights: Bella:0.6, Sky:0.4. Without weights the voices count equally. Up to 5."}
      - *audio-format

  qwen-image-21:
    name: Qwen-Image 2.1
    kind: image
    engine: comfy
    license: qwen-research
    summary: Qwen's newer model. Long, exact lettering and fine detail up to 4 MP in eight steps. The pictures are yours to use.
    settings: {prompt_style: qwen-image-21, steps: 8, cfg: 1.0}
    variants:
      - when: {backend: cuda, cuda_tag: cu130}
        workflow: qwen21-image
        files: [qwen21-turbo-int8, qwen3vl-8b-w4a8, qwen21-vae]
    controls:
      - *qwen21-steps
      - {name: megapixels, type: float, min: 0.5, max: 4.0, step: 0.1, default: 2.0, unit: MP, label: Size, help: "How many pixels. Bigger takes longer; this model is made for up to 4 MP, which a 12 GB card fits in about half a minute."}
      - {name: trained_sizes, type: bool, default: false, label: Use the trained sizes, help: "Qwen-Image 2.1's own 4 MP size for each shape (2048 x 2048, 2752 x 1536 for 16:9 and so on), instead of the Size above."}
      - {name: transparent, type: bool, default: false, label: Transparent background, help: "Makes a cut-out on a clear background, saved as a PNG with transparency. Describe only the subject."}
      - *qwen21-loras
      - *qwen-sampler
      - *qwen21-scheduler

  qwen-image:
    name: Qwen-Image
    kind: image
    engine: comfy
    license: apache-2.0
    summary: The one to use for words in pictures. Logos, signs, posters, labels. Eight steps.
    settings: {prompt_style: qwen-image, steps: 8, cfg: 1.0, shift: 3.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-8step-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-8step-fp4, qwen25vl-fp8, qwen-image-vae]
    controls:
      - {name: steps, type: int, min: 6, max: 10, default: 8, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 8."}
      - {name: megapixels, type: float, min: 0.5, max: 2.0, step: 0.1, default: 1.7, unit: MP, label: Size, help: "How many pixels. Bigger takes longer; about 2 MP is the most a 12 GB card fits."}
      - {name: trained_sizes, type: bool, default: false, label: Use the trained sizes, help: "Qwen-Image's own size for each shape (1664 x 928 for 16:9 and so on), instead of the Size above."}
      - {name: shift, type: float, tier: expert, min: 2, max: 5, step: 0.1, default: 3.0, label: Shift, help: "Higher if pictures come out blurry or dark, lower for more fine detail."}
      - *qwen-sampler
      - *scheduler

  qwen-image-fast:
    name: Qwen-Image Fast
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Qwen-Image's text and layout in four steps. Use it for drafts, then switch to Qwen-Image.
    settings: {prompt_style: qwen-image, steps: 4, cfg: 1.0, shift: 3.0}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-fast-int4, qwen25vl-fp8, qwen-image-vae]
      - when: {backend: cuda, quant: fp4}
        workflow: qwen-image-nunchaku
        files: [qwen-image-fast-fp4, qwen25vl-fp8, qwen-image-vae]
    controls:
      - {name: steps, type: int, min: 2, max: 6, default: 4, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 4."}
      - {name: megapixels, type: float, min: 0.5, max: 2.0, step: 0.1, default: 1.7, unit: MP, label: Size, help: "How many pixels. Bigger takes longer; about 2 MP is the most a 12 GB card fits."}
      - {name: trained_sizes, type: bool, default: false, label: Use the trained sizes, help: "Qwen-Image's own size for each shape (1664 x 928 for 16:9 and so on), instead of the Size above."}
      - {name: shift, type: float, tier: expert, min: 2, max: 5, step: 0.1, default: 3.0, label: Shift, help: "Higher if pictures come out blurry or dark, lower for more fine detail."}
      - *qwen-sampler
      - *scheduler

  z-image-turbo:
    name: Z-Image Turbo
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Quick, sharp pictures in 9 steps. Strong at photographs.
    settings: {prompt_style: zimage}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: z-image-nunchaku
        files: [zimage-int4, qwen3-4b, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: z-image-nunchaku
        files: [zimage-fp4, qwen3-4b, flux-ae]
      - when: {backend: mps}
        workflow: z-image-native
        files: [zimage-bf16, qwen3-4b, flux-ae]
        preview: true
    controls:
      - *size-1mp
      - {name: steps, type: int, min: 6, max: 12, default: 9, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 9."}
      - *zimage-loras
      - {name: shift, type: float, tier: expert, min: 1, max: 7, step: 0.1, default: 3.0, label: Shift, help: "Higher favours overall shapes, lower favours fine detail."}
      - {name: sampler, type: choice, tier: expert, default: res_multistep, options: [res_multistep, euler, dpmpp_2m, er_sde], label: Sampler, help: "The method that removes noise at each step. res_multistep is what this model was tuned with."}
      - *scheduler

  # Z-Image Turbo steered by a picture. The Fun ControlNet reads an edge, depth or
  # pose map; edges come from ComfyUI's own Canny, depth from Depth Anything 3
  # (small), pose from SDPose. Nunchaku's own example runs this ControlNet on the
  # 4-bit model, so only the Nunchaku variants exist.
  z-image-control:
    name: Z-Image Turbo with a guide picture
    kind: image
    engine: comfy
    license: zimage-control
    summary: Draws a new picture that follows the outline, depth or pose of a picture you give it. Same quick Z-Image Turbo, plus a 3 GB guide model and two small readers (depth and pose, 2 GB).
    settings: {prompt_style: zimage}
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: z-image-control
        files: [zimage-int4, qwen3-4b, flux-ae, zimage-fun-union, da3-small, sdpose-wholebody]
      - when: {backend: cuda, quant: fp4}
        workflow: z-image-control
        files: [zimage-fp4, qwen3-4b, flux-ae, zimage-fun-union, da3-small, sdpose-wholebody]
    controls:
      - {name: guide_strength, type: float, min: 0.3, max: 1.0, step: 0.05, default: 0.75, label: How closely to follow the guide, help: "Higher follows the guide picture more strictly; lower gives your words more room. The makers suggest 0.65 to 0.8, so 0.75 is the starting point; go lower if the result looks stiff or traced."}
      - *size-1mp
      - {name: steps, type: int, min: 6, max: 12, default: 9, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 9."}
      - *zimage-loras
      - {name: shift, type: float, tier: expert, min: 1, max: 7, step: 0.1, default: 3.0, label: Shift, help: "Higher favours overall shapes, lower favours fine detail."}
      - {name: sampler, type: choice, tier: expert, default: res_multistep, options: [res_multistep, euler, dpmpp_2m, er_sde], label: Sampler, help: "The method that removes noise at each step. res_multistep is what this model was tuned with."}
      - *scheduler

  krea-2:
    name: Krea 2
    kind: image
    engine: comfy
    license: krea-2-community
    summary: Photographs with natural skin, hands and fur, even from a short prompt. Eight steps, about ten seconds.
    variants:
      - when: {backend: cuda, quant: int4, cuda_tag: cu130}
        workflow: krea2
        files: [krea2-turbo-w4a4, krea2-text-encoder, qwen-image-vae]
      - when: {backend: cuda, quant: fp4, cuda_tag: cu130}
        workflow: krea2
        files: [krea2-turbo-w4a4, krea2-text-encoder, qwen-image-vae]
    settings: {prompt_style: krea2, steps: 8, cfg: 1.0}

    controls:
      - *size-1mp
      - {name: steps, type: int, min: 4, max: 12, default: 8, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 8."}
      - *qwen-sampler
      - *scheduler
  flux-dev:
    name: FLUX.1 dev
    kind: image
    engine: comfy
    license: flux-dev-nc
    summary: Detailed images in 20 steps. Works best with a full description. Non-commercial.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [flux-dev-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [flux-dev-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux, steps: 20, guidance: 3.5, shift: true}
    controls:
      - {name: guidance, type: float, min: 1, max: 6, step: 0.1, default: 3.5, label: Follow the prompt, help: "Higher sticks closer to your words and adds contrast; lower looks more natural."}
      - {name: steps, type: int, min: 8, max: 40, default: 20, label: Steps, help: "More is slower and sometimes finer. 20 is recommended."}
      - *size-1mp
      - *flux-loras
      - *flux-shift
      - *flux-sampler
      - *scheduler

  flux-schnell:
    name: FLUX.1 schnell
    kind: image
    engine: comfy
    license: apache-2.0
    summary: Four steps to a finished image. Good for illustration and quick ideas.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [schnell-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [schnell-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux-schnell, steps: 4, guidance: null}
    controls:
      - *size-1mp
      - {name: steps, type: int, min: 1, max: 8, default: 4, label: Steps, help: "More is slower and sometimes finer. This model is tuned for 4."}
      - *flux-loras
      - *flux-sampler
      - *scheduler

  flux-krea:
    name: FLUX.1 Krea
    kind: image
    engine: comfy
    license: flux-dev-nc
    summary: Photoreal without the glossy "AI look". Non-commercial.
    variants:
      - when: {backend: cuda, quant: int4}
        workflow: flux-nunchaku
        files: [flux-krea-int4, t5xxl-fp8, clip-l, flux-ae]
      - when: {backend: cuda, quant: fp4}
        workflow: flux-nunchaku
        files: [flux-krea-fp4, t5xxl-fp8, clip-l, flux-ae]
    settings: {prompt_style: flux, steps: 28, guidance: 4.5, shift: true}
    controls:
      - {name: guidance, type: float, min: 1, max: 6, step: 0.1, default: 4.5, label: Follow the prompt, help: "Higher sticks closer to your words and adds contrast; lower looks more natural."}
      - {name: steps, type: int, min: 8, max: 40, default: 28, label: Steps, help: "More is slower and sometimes finer. 28 is recommended."}
      - *size-1mp
      - *flux-loras
      - *flux-shift
      - *flux-sampler
      - *scheduler
