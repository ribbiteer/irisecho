name: release

# Builds the Windows installer when a version tag is pushed and attaches it to
# a draft release, so it can be checked before publishing. macOS joins the
# matrix once it has been run on real hardware.
#
# Three jobs: the same checks as CI, on the tagged commit; the build, which runs
# npm and cargo and can only read the repository; and a small job that makes the
# draft release, the only one allowed to write. Actions are pinned to commits.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-10
        with:
          toolchain: stable
      - run: uv sync --locked
      - name: The tag names the version in the tree
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python scripts/bump_version.py --check --tag "$TAG"
      - run: uv run python scripts/build_desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/SHA256SUMS
