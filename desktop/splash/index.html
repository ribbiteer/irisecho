<!doctype html>

     Shown by the desktop shell while it prepares and starts the core. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IrisEcho</title>
<style>
  :root {
    --pupil: #0E0B16; --limbus: #2A2140; --violet: #6B5BD6; --teal: #2FB8A6;
    --amber: #F2A541; --sclera: #F3F0FA; --danger: #f7a1a9;
  }
  html, body { margin: 0; height: 100%; background: var(--pupil); color: var(--sclera);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  main { height: 100%; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px; text-align: center; }
  h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0; color: rgb(243 240 250 / 0.66); max-width: 460px; line-height: 1.5; }
  .log { width: min(640px, 90vw); height: 132px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; color: rgb(243 240 250 / 0.42);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60%); mask-image: linear-gradient(to bottom, transparent, #000 60%); }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .error { color: var(--danger); white-space: pre-line; text-align: left; font: 13px/1.5 ui-monospace, Consolas, monospace;
    background: rgb(239 106 118 / 0.08); border: 1px solid rgb(239 106 118 / 0.3); border-radius: 12px; padding: 12px 14px; max-width: 640px; }
  .actions { display: flex; gap: 10px; }
  button { font: inherit; color: var(--sclera); background: #241e35; border: 1px solid rgb(243 240 250 / 0.14);
    border-radius: 12px; height: 38px; padding: 0 16px; cursor: pointer; }
  button.primary { background: var(--violet); border-color: transparent; }
  .fiber { transform-box: fill-box; transform-origin: center bottom; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1.08); } }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .fiber { animation: none; } }
</style>
</head>
<body>
<main>
  <svg id="iris" width="120" height="120" viewBox="-50 -50 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="g" cx="0" cy="0" r="47" gradientUnits="userSpaceOnUse">
        <stop offset="0.43" stop-color="#F2A541"/><stop offset="0.68" stop-color="#2FB8A6"/><stop offset="1" stop-color="#6B5BD6"/>
      </radialGradient>
    </defs>
    <g id="fibers" fill="url(#g)"></g>
    <circle r="17" fill="#0E0B16"/><circle r="17" fill="none" stroke="#2A2140" stroke-width="1.6"/>
    <circle cx="-6.1" cy="-6.5" r="3.4" fill="#F3F0FA"/>
  </svg>
  <h1 id="title">IrisEcho</h1>
  <p id="message">Getting ready</p>
  <div id="log" class="log"></div>
  <div id="error" class="error hidden"></div>
  <div id="actions" class="actions hidden">
    <button class="primary" id="retry">Try again</button>
    <button id="logs">Open the log folder</button>
  </div>
</main>
<script>
  // The fibers of the mark, pulsing while IrisEcho gets ready.
  const g = document.getElementById("fibers");
  const n = 48;
  for (let i = 0; i < n; i++) {
    const t = (2 * Math.PI * i) / n;
    const v = Math.min(1, Math.max(0, 0.58 + 0.07 * Math.sin(3 * t + 0.6) + 0.13 * Math.sin(8 * t + 1.9) + 0.12 * Math.sin(13 * t + 0.3) + 0.1 * Math.sin(31 * t + 2.2)));
    const len = 12 + v * 15;
    const grp = document.createElementNS("http://www.w3.org/2000/svg", "g");
    grp.setAttribute("transform", `rotate(${(360 * i) / n})`);
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    Object.entries({ x: -1.1, y: -(20 + len), width: 2.2, height: len, rx: 1.1, class: "fiber" }).forEach(([k, val]) => r.setAttribute(k, val));
    r.style.animationDelay = `-${((i / n) * 1.6).toFixed(3)}s`;
    grp.appendChild(r);
    g.appendChild(grp);
  }

  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  let shown = 0;

  async function poll() {
    let s;
    try { s = await invoke("boot_status"); } catch { return setTimeout(poll, 400); }
    $("message").textContent = s.message || "Getting ready";
    const log = $("log");
    for (const line of s.lines.slice(shown)) {
      const d = document.createElement("div");
      d.textContent = line;
      log.appendChild(d);
    }
    shown = s.lines.length;
    while (log.children.length > 12) log.removeChild(log.firstChild);
    const failed = s.stage === "error";
    $("error").textContent = failed ? s.message : "";
    $("error").classList.toggle("hidden", !failed);
    $("actions").classList.toggle("hidden", !failed);
    $("message").classList.toggle("hidden", failed);
    $("title").textContent = failed ? "IrisEcho could not start" : "IrisEcho";
    document.querySelectorAll(".fiber").forEach((f) => (f.style.animationPlayState = failed ? "paused" : "running"));
    if (s.stage !== "ready") setTimeout(poll, failed ? 1500 : 300);
  }
  $("retry").onclick = () => { shown = 0; $("log").textContent = ""; invoke("retry_boot").then(() => setTimeout(poll, 300)); };
  $("logs").onclick = () => invoke("open_logs");
  poll();
</script>
</body>
</html>
